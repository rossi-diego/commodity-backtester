[client]
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#c58512"
backgroundColor = "#0b1016"
secondaryBackgroundColor = "#141b23"
textColor = "#eef2f6"
borderColor = "#2a3440"
linkColor = "#8ab8f5"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap, sans-serif"
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseFontSize = 15
metricValueFontSize = "1.625rem"
metricValueFontWeight = 600
baseRadius = "6px"
buttonRadius = "6px"
showWidgetBorder = true
paddingTop = "1rem"
chartCategoricalColors = ["#c58512", "#4d8fe8", "#7d8796"]
